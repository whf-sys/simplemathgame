<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🌟 乘法大冒險！九九乘數趣味挑戰賽</title>
  <style>
    :root {
      --primary: #FF6B6B;
      --secondary: #4ECDC4;
      --accent: #FFE66D;
      --purple: #6C5CE7;
      --bg: #F7F9FC;
      --text: #2D3436;
      --card-bg: #FFFFFF;
      --shadow: 0 10px 25px rgba(0,0,0,0.08);
      --border-radius: 24px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'PingFang SC', 'Microsoft JhengHei', system-ui, -apple-system, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      color: var(--text);
    }

    .game-container {
      background: var(--card-bg);
      width: 100%;
      max-width: 680px;
      border-radius: var(--border-radius);
      box-shadow: var(--shadow);
      padding: 35px 30px;
      position: relative;
      overflow: hidden;
      border: 4px solid #FFF;
    }

    /* 頂部常駐面板 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
      padding-bottom: 15px;
      border-bottom: 3px dashed #E2E8F0;
    }

    .badge {
      background: var(--purple);
      color: white;
      padding: 8px 18px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .timer-display {
      font-size: 22px;
      font-weight: bold;
      color: var(--primary);
      background: #FFF0F0;
      padding: 6px 16px;
      border-radius: 30px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* 通用按鈕 */
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 14px 36px;
      font-size: 20px;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 0 #D63031;
      transition: all 0.15s ease;
      display: inline-block;
      margin-top: 15px;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #D63031;
    }

    .btn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #D63031;
    }

    .btn-secondary {
      background: var(--secondary);
      box-shadow: 0 6px 0 #00A896;
    }
    .btn-secondary:hover {
      box-shadow: 0 8px 0 #00A896;
    }
    .btn-secondary:active {
      box-shadow: 0 2px 0 #00A896;
    }

    /* 視圖控制 */
    .screen {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 首頁規則卡片 */
    .hero-title {
      font-size: 32px;
      text-align: center;
      color: var(--purple);
      margin-bottom: 20px;
    }

    .rule-card {
      background: #F8F9FA;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 25px;
      border-left: 6px solid var(--secondary);
    }

    .rule-item {
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 10px;
    }

    /* 關卡輸入與題目 */
    .question-title {
      font-size: 24px;
      text-align: center;
      margin-bottom: 20px;
      color: #2D3436;
    }

    .level1-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .grid-item {
      background: #F1F2F6;
      padding: 12px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .input-box {
      width: 65px;
      height: 45px;
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      border: 2px solid #CBD5E0;
      border-radius: 10px;
      margin-left: 8px;
      outline: none;
      transition: border 0.2s;
    }

    .input-box:focus {
      border-color: var(--purple);
      background: #FAF5FF;
    }

    .feedback-msg {
      text-align: center;
      font-size: 16px;
      min-height: 24px;
      margin-top: 10px;
      font-weight: bold;
    }
    .msg-error { color: #E53E3E; }
    .msg-success { color: #38A169; }

    /* 結果結算頁 */
    .result-box {
      text-align: center;
      padding: 20px 0;
    }
    .result-time {
      font-size: 42px;
      font-weight: 900;
      color: var(--primary);
      margin: 20px 0;
    }
    .stars {
      font-size: 40px;
      margin-bottom: 15px;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <!-- 常駐計時條 (遊戲進行時顯示) -->
    <div class="top-bar" id="topBar" style="display: none;">
      <span class="badge" id="levelBadge">乘數表挑戰</span>
      <div class="timer-display">
        ⏱️ <span id="timeCounter">00:00.0</span>
      </div>
    </div>

    <!-- 首頁 / 規則頁 -->
    <div class="screen active" id="screenHome">
      <h1 class="hero-title">🚀 九九乘數大冒險</h1>
      <div class="rule-card">
        <div class="rule-item">🎯 <strong>挑戰任務：</strong> 隨機抽出一個數字，迅速完成整套乘數表！</div>
        <div class="rule-item">⏱️ <strong>計時挑戰：</strong> 挑戰最快完成時間，全部答對即可過關！</div>
        <div class="rule-item">🛡️ <strong>貼心防護：</strong> 遊戲中誤觸重整將會有提示視窗保護進度。</div>
      </div>
      <div style="text-align: center;">
        <button class="btn" onclick="startGame()">開始挑戰 🎮</button>
      </div>
    </div>

    <!-- 遊戲關卡 (原第 1 關) -->
    <div class="screen" id="screenL1">
      <h2 class="question-title" id="l1Title">請寫出所有乘數表</h2>
      <div class="level1-grid" id="l1Container"></div>
      <div class="feedback-msg" id="l1Msg"></div>
      <div style="text-align: center;">
        <button class="btn btn-secondary" onclick="checkLevel1()">提交答案 ✅</button>
      </div>
    </div>

    <!-- 結算頁面 -->
    <div class="screen" id="screenResult">
      <div class="result-box">
        <div class="stars">🏆 🌟 🎉</div>
        <h2 style="font-size: 28px; color: var(--purple);">恭喜通關！乘法達人！</h2>
        <p style="margin-top: 10px; color: #718096;">你的總通關成績：</p>
        <div class="result-time" id="finalTime">00:00.0</div>
        <button class="btn" onclick="resetToHome()">再玩一次 🔄</button>
      </div>
    </div>
  </div>

  <script>
    // 遊戲狀態全域變數
    let isPlaying = false;
    let timerInterval = null;
    let startTime = null;
    let l1Target = 2;

    // 攔截重新整理與關閉頁面 (防止誤觸 F5/Refresh)
    window.addEventListener('beforeunload', function (e) {
      if (isPlaying) {
        e.preventDefault();
        e.returnValue = '遊戲仍在進行中，確認要重新載入並放棄當前進度嗎？';
        return e.returnValue;
      }
    });

    // 計時器邏輯
    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const diff = Date.now() - startTime;
        const totalSeconds = Math.floor(diff / 1000);
        const ms = Math.floor((diff % 1000) / 100);
        const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const secs = String(totalSeconds % 60).padStart(2, '0');
        document.getElementById('timeCounter').textContent = `${mins}:${secs}.${ms}`;
      }, 100);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      const diff = Date.now() - startTime;
      const totalSeconds = Math.floor(diff / 1000);
      const ms = Math.floor((diff % 1000) / 100);
      const mins = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
      const secs = String(totalSeconds % 60).padStart(2, '0');
      return `${mins}分 ${secs}.${ms}秒`;
    }

    // 切換畫面工具函式
    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    // 開始遊戲
    function startGame() {
      isPlaying = true;
      document.getElementById('topBar').style.display = 'flex';
      startTimer();
      setupLevel1();
    }

    // 關卡初始化與檢查
    function setupLevel1() {
      // 隨機抽出 2 - 9 的數字
      l1Target = Math.floor(Math.random() * 8) + 2;
      document.getElementById('levelBadge').textContent = '乘數表挑戰';
      document.getElementById('l1Title').textContent = `請寫出【${l1Target}】的所有乘數表`;
      const container = document.getElementById('l1Container');
      container.innerHTML = '';
      document.getElementById('l1Msg').textContent = '';

      for (let i = 1; i <= 9; i++) {
        const item = document.createElement('div');
        item.className = 'grid-item';
        item.innerHTML = `${l1Target} × ${i} = <input type="number" class="input-box l1-input" data-ans="${l1Target * i}">`;
        container.appendChild(item);
      }
      showScreen('screenL1');
    }

    function checkLevel1() {
      const inputs = document.querySelectorAll('.l1-input');
      let allCorrect = true;

      inputs.forEach(input => {
        const userVal = parseInt(input.value.trim(), 10);
        const correctVal = parseInt(input.dataset.ans, 10);
        if (userVal !== correctVal) {
          allCorrect = false;
          input.style.borderColor = '#E53E3E';
        } else {
          input.style.borderColor = '#38A169';
        }
      });

      const msg = document.getElementById('l1Msg');
      if (allCorrect) {
        msg.className = 'feedback-msg msg-success';
        msg.textContent = '🌟 太厲害了！全部正確！';
        finishGame();
      } else {
        msg.className = 'feedback-msg msg-error';
        msg.textContent = '有部分答案不正確或未填寫，再檢查一下喔！';
      }
    }

    // 完成遊戲結算
    function finishGame() {
      isPlaying = false; // 解除防離開限制
      const finalTimeString = stopTimer();
      document.getElementById('topBar').style.display = 'none';
      document.getElementById('finalTime').textContent = finalTimeString;
      showScreen('screenResult');
    }

    // 重設回首頁
    function resetToHome() {
      showScreen('screenHome');
      document.getElementById('topBar').style.display = 'none';
      document.getElementById('timeCounter').textContent = '00:00.0';
    }
  </script>
</body>
</html>
